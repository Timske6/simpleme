plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

// e.g. simpleme-1.0.0+26.3.jar, so players see which Minecraft version a file is for
version = "${project.mod_version}+${project.minecraft_version}"

base {
	archivesName = project.archives_base_name
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"simpleme" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

fabricApi {
	// Automated in-game test: ./gradlew runClientGameTest
	configureTests {
		createSourceSet = true
		modId = "simpleme-test"
		enableClientGameTests = true
		enableGameTests = true
		eula = true
	}
}

repositories {
	// JEI (optional integration: recipe transfer into the terminal crafting grid)
	maven {
		name = 'BlameJared'
		url = 'https://maven.blamejared.com/'
		content { includeGroup 'mezz.jei'; includeGroup 'net.mezzdev.config' }
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// JEI is optional: compiled against its API, only loaded in the dev client (./gradlew runClient)
	compileOnly "mezz.jei:jei-${project.minecraft_version}-common-api:${project.jei_version}"
	compileOnly "mezz.jei:jei-${project.minecraft_version}-fabric-api:${project.jei_version}"
	localRuntime "mezz.jei:jei-${project.minecraft_version}-fabric:${project.jei_version}"
	gametestCompileOnly "mezz.jei:jei-${project.minecraft_version}-common-api:${project.jei_version}"
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
	it.options.encoding = "UTF-8"
}

java {
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	// ship the license inside the mod jar (once a LICENSE file exists)
	from("LICENSE") {
		rename { "${it}_${project.archives_base_name}" }
	}
}
